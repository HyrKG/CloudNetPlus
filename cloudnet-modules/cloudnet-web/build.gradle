def frontendDirectory = file('frontend')
def frontendOutput = file("$buildDir/web")
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('installFrontend', Exec) {
  workingDir frontendDirectory
  commandLine npmCommand, 'ci', '--no-audit', '--no-fund'
  inputs.files('frontend/package.json', 'frontend/package-lock.json')
  outputs.dir('frontend/node_modules')
}

tasks.register('buildFrontend', Exec) {
  dependsOn tasks.named('installFrontend')
  workingDir frontendDirectory
  commandLine npmCommand, 'run', 'build'
  inputs.files(fileTree(frontendDirectory) {
    exclude 'node_modules/**', '.env*.local'
  })
  outputs.dir(frontendOutput)
}

processResources {
  dependsOn tasks.named('buildFrontend')
  from(frontendOutput) {
    into 'web'
  }
}

jar {
  archiveFileName.set('cloudnet-web.jar')
}

dependencies {
  compileOnly project(':cloudnet')
  compileOnly project(':cloudnet-modules:cloudnet-rest')
  compileOnly project(':cloudnet-modules:cloudnet-bridge')
}
